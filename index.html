<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>ATG 제품 가격 검색</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>ATG 제품 가격 검색</h1>
            <p class="app-subtitle">Chrome 브라우저에서 음성 검색이 최적화됩니다.</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="품목코드 또는 품목명 (쉼표로 다중검색)">
            <button class="btn-icon btn-mic" id="voiceSearchButton">
                <i class="fas fa-microphone" id="micIcon"></i>
                <span id="voiceSearchText" style="display: none;">...</span>
            </button>
            <button class="btn-icon btn-search" id="searchButton">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="margin-input-group">
            <span class="margin-label">이익률 설정 (%)</span>
            <input type="number" id="discountRate" value="10">
            <div style="flex-grow: 1; text-align: right;">
                <button id="toggleAdvanced" style="background: none; border: none; color: #2563eb; font-size: 12px; font-weight: 700;">다중 입력창</button>
            </div>
        </div>

        <div id="advancedSearchSection" class="advanced-search-card" style="display: none;">
            <h5>다중 규격 검색 (최대 10개)</h5>
            <textarea id="multiSearchInput" class="form-control mb-2" rows="3" placeholder="예: PGX-044-H-003, PDM-020-N-120" style="width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 10px;"></textarea>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button class="btn-icon" id="resetButton" style="background: #f1f5f9; width: auto; padding: 0 16px; font-size: 13px; font-weight: 600;">초기화</button>
                <button class="btn-icon" id="multiSearchButton" style="background: #0ea5e9; color: white; width: auto; padding: 0 16px; font-size: 13px; font-weight: 600;">검색 실행</button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <h3>검색 결과</h3>
                <button id="copyAllButton" style="display: none; background: #22c55e; color: white; border: none; padding: 4px 12px; border-radius: 10px; font-size: 11px; font-weight: 700;">
                    <i class="fas fa-copy me-1"></i> 전체 복사
                </button>
            </div>
            
            <div id="resultsList">
                <!-- 결과 카드가 여기에 생성됩니다 -->
                <div class="placeholder-message" style="text-align: center; padding: 40px 0; color: #94a3b8; font-style: italic; font-size: 14px;">
                    데이터를 불러오는 중입니다...
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <div class="version-info">UPDATE: 2026.05.22 | MADE BY 알프</div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        // 간단한 토글 기능 추가
        document.getElementById('toggleAdvanced').addEventListener('click', () => {
            const section = document.getElementById('advancedSearchSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        });
    </script>
</body>
</html>
